services:
  - type: web
    name: community-disaster-management
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build:frontend
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
